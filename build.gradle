plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.146'
    id 'idea'
    // One task publishes the jar to GitHub, CurseForge and Modrinth: see publishMods below.
    id 'me.modmuss50.mod-publish-plugin' version '2.2.0'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

// Gametests live in their own source set and their own mod, mirroring EnderIO's layout.
sourceSets {
    // Datagen classes never ship in the jar; their output does (src/generated/resources).
    datagen {
        compileClasspath += sourceSets.main.output
    }
    gametest {
        compileClasspath += sourceSets.main.output
    }
}

repositories {
    // Mekanism, for the cross-mod gametests (SPEC.md §15). Its own maven; EnderIO publishes to
    // no public maven at all, which is why only one foreign mod is wired up here.
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev'
        content { includeGroup 'mekanism' }
    }

    // JEI and EMI, for their ghost-ingredient APIs only. Both are compileOnly: SPEC.md §5 requires
    // every ghost slot in the mod to accept a drag from either, and neither may be needed to load.
    maven {
        name = 'Jared'
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
        content { includeGroup 'dev.emi' }
    }
}

base {
    // Loader and game version in the file name, so a player sorting a mods folder reads it at a glance.
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // define mod <-> source bindings
    // these are used to tell the game which sources are for which mod
    // multi mod projects should define one per mod
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.datagen)
        }

        // The gametests are their own mod so they can be loaded only where they are wanted.
        "${mod_id}_tests" {
            sourceSet(sourceSets.gametest)
        }
    }

    // Give the extra source sets the Minecraft/NeoForge classes to compile against.
    addModdingDependenciesTo(sourceSets.datagen)
    addModdingDependenciesTo(sourceSets.gametest)

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            programArguments.addAll '--quickPlaySingleplayer', (findProperty('workbay.world') ?: 'Correction')
            // -Pworkbay.user=Stranger logs in as somebody else, for the stranger's side of a lock.
            if (project.hasProperty('workbay.user')) programArguments.addAll '--username', project.property('workbay.user')
            // To drive the client without a human, add:
            //   programArguments.addAll '--quickPlaySingleplayer', '<world name in run/saves>'
            // It boots straight past the menus. Left out by default because it fails on a fresh
            // clone, which has no world yet. See the project conventions for driving a client.
        }

        server {
            server()
            programArgument '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            loadedMods = [mods.getByName(mod_id), mods.getByName("${mod_id}_tests")]
            // Its own game directory, wiped before every run by cleanGameTestWorld below. The
            // Backshop is a persistent dimension, so sharing run/ with the client let one run's
            // leftovers -- a furnace still burning coal from the last run -- seed the next one.
            gameDirectory = project.file('run-gametest')
            // No 'neoforge.enabledGameTestNamespaces': NeoForge's test framework registers its
            // gametests under its own namespace, so any filter here drops every test. EnderIO
            // sets no filter either. A subset is WorkbayTests' own filter:
            //   ./gradlew runGameTestServer -Pworkbay.tests='aConnector.*|addOnAGone.*'
            if (project.hasProperty('workbay.tests')) {
                systemProperty 'workbay.tests', project.property('workbay.tests')
            }
        }

        // The same headless server, with the performance bench switched on. Everything in
        // PerfBench checks this property and passes without it, so the ordinary gametest run
        // never pays for a measurement that takes minutes.
        benchmark {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            loadedMods = [mods.getByName(mod_id), mods.getByName("${mod_id}_tests")]
            gameDirectory = project.file('run-gametest')
            systemProperty 'workbay.bench', 'true'
        }

        data {
            data()
            sourceSet = sourceSets.datagen
            // Only the mod itself. Without this the gametest mod is loaded too and fails
            // to construct, because the test framework is not on the datagen classpath.
            loadedMods = [mods.getByName(mod_id)]
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime

    datagenImplementation.extendsFrom implementation
    datagenCompileOnly.extendsFrom compileOnly
    datagenRuntimeOnly.extendsFrom runtimeOnly

    gametestImplementation.extendsFrom implementation
    gametestCompileOnly.extendsFrom compileOnly
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    // A real third-party mod, loaded only by runGameTestServer. The whole product claim is that
    // Workbay hosts other mods' machines, and until this was here nothing proved it. Mekanism is
    // the harder partner on purpose: owner UUIDs written in setPlacedBy, sided config, and the
    // read-only null-side handler SPEC.md §9 warns about.
    gametestRuntimeOnly "mekanism:Mekanism:${mekanism_version}"
    // And in runClient, so the same claim can be checked by hand: rack a real Enrichment Chamber,
    // point links at it, watch it run. gametestRuntimeOnly does not reach the client run, and the
    // gametest classpath does not extend localRuntime, so it is declared for both.
    localRuntime "mekanism:Mekanism:${mekanism_version}"

    // NeoForge's test framework, used by the gametest source set (same as EnderIO).
    gametestImplementation("net.neoforged:testframework:${neo_version}") { transitive = false }
    // Available at runtime in the client/server runs too, but not published as a dependency.
    localRuntime("net.neoforged:testframework:${neo_version}") { transitive = false }

    // Ghost ingredients dragged out of the recipe viewer, SPEC.md §5. API only, and never
    // published as a dependency: both plugins are guarded and the mod loads with neither mod
    // installed. The full JEI is available to runClient so the drag can actually be tried.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    // -Pworkbay.noJei leaves it out, for a shot that must show no other mod's overlay.
    if (!project.hasProperty('workbay.noJei')) localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"

    // Mekanism's API, for chemicals only. compileOnly and guarded exactly as JEI and EMI are: a
    // chemical has no NeoForge capability, so the one alternative to this is not showing a gas at
    // all, and Mekanism is too large a share of what anyone will rack for that to be right.
    compileOnly "mekanism:Mekanism:${mekanism_version}:api"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// MIT asks that the notice travel with every copy, and NeoForge shows nobody the toml's license=.
tasks.named('jar', Jar) {
    from('LICENSE')
    manifest.attributes(
        'Implementation-Title': mod_name,
        'Implementation-Version': mod_version,
        'Implementation-Vendor': 'Neryos',
    )
}

// Publishing goes through this one plugin. Chosen over CurseGradle + Minotaur + the gh CLI
// because it is one plugin with one DSL for all three targets and a built-in dry run; over a
// curl script because the three APIs' upload formats are somebody else's problem to keep
// current. Tokens are never in the repo: they are read from outside it, and any token missing
// turns the run into a dry run.
publishMods {
    file = jar.archiveFile
    displayName = "Workbay ${mod_version} for NeoForge ${minecraft_version}"
    version = mod_version
    type = STABLE
    modLoaders.add('neoforge')
    // The changelog is the top section of CHANGELOG.md: from its first '## ' heading to the next.
    changelog = providers.fileContents(layout.projectDirectory.file('CHANGELOG.md')).asText.map { t ->
        def m = (t =~ /(?s)(## [^\n]*\n.*?)(?=\n## |\z)/)
        m.find() ? m.group(1).trim() : t
    }
    def tokens = ['CURSEFORGE_TOKEN', 'MODRINTH_TOKEN', 'GITHUB_TOKEN']
    dryRun = project.hasProperty('workbay.dryRun') ||
        tokens.any { providers.environmentVariable(it).getOrNull() == null }

    curseforge {
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        projectId = curseforge_project_id
        projectSlug = 'workbay'
        minecraftVersions.add(minecraft_version)
        javaVersions.add(JavaVersion.VERSION_21)
        client = true
        server = true
        optional('jei', 'emi', 'mekanism')
    }
    modrinth {
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        projectId = modrinth_project_id
        minecraftVersions.add(minecraft_version)
        optional { slug = 'jei' }
        optional { slug = 'emi' }
        optional { slug = 'mekanism' }
    }
    github {
        accessToken = providers.environmentVariable('GITHUB_TOKEN')
        repository = 'neryosx/workbay'
        commitish = 'master'
        tagName = "v${mod_version}"
    }
}

// 'build' would otherwise skip the gametest source set entirely, so a compile error in
// src/gametest passes the build and only surfaces when someone runs runGameTestServer.
tasks.named('check') {
    dependsOn 'compileGametestJava', 'compileDatagenJava'
}

// A gametest must not be able to see the previous run's world, or a test that only passes
// because of what the last run left behind looks exactly like a test that passes.
var cleanGameTestWorld = tasks.register('cleanGameTestWorld', Delete) {
    delete project.file('run-gametest/world')
}
tasks.named('runGameTestServer') {
    dependsOn cleanGameTestWorld
}

// The bench appends one file per window, so last run's numbers must not still be in them.
var cleanBenchmark = tasks.register('cleanBenchmark', Delete) {
    delete project.file('run-gametest/perf')
}
tasks.named('runBenchmark') {
    dependsOn cleanGameTestWorld, cleanBenchmark
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
