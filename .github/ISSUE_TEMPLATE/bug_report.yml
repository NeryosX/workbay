name: Bug report
description: Report something that isn't working as expected
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. The more detail you give below, the faster this can be reproduced and fixed.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the exact steps that trigger the issue.
      placeholder: |
        1. Go to '...'
        2. Do '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The exact version this happened on. "Latest" is not a version.
      placeholder: e.g. 1.0.0
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Platform, and anything else running alongside that could matter.
      placeholder: |
        - Platform/OS:
        - Other relevant setup (mods, plugins, config):
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, video, or logs
      description: >
        Drag and drop images or a short screen recording here, or paste a link
        (e.g. a YouTube/Imgur link or a log file). Not required, but it helps a lot.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else worth knowing - when it started, workarounds you've tried, etc.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and didn't find a duplicate
          required: true
        - label: I'm using the latest available version
          required: false
